name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: Create as draft release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: XinOne v__VERSION__
          releaseBody: |
            Windows 向け XinOne v__VERSION__ です。

            ## ダウンロード

            - **XinOne___VERSION___x64-setup.exe** — 一般向けインストーラー（NSIS）
            - **XinOne___VERSION___x64_en-US.msi** — MSI インストーラー
            - **xinone.exe** — ポータブル実行ファイル（WebView2 等が PC に入っている前提）

            Web 版は [GitHub Pages](https://kavao.github.io/XinOne/) からプレイできます。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: false
          includeUpdaterJson: false
          uploadPlainBinary: true
          generateReleaseNotes: true
